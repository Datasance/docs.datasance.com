# LocalControlPlane — dev/test single node (v3.9.x)
# Deploy: potctl deploy -f minimal.yaml -n default

apiVersion: {{API_VERSION}}
kind: LocalControlPlane
metadata:
  name: local-cp
spec:
  endpoint: http://host-ip:51121
  iofogUser:
    email: dev@example.com
  controller:
    publicUrl: http://host-ip:51121
    consoleUrl: http://host-ip:80
    logLevel: info
    package:
      image: {{REGISTRY}}/controller:3.9.3
  auth:
    mode: embedded
    bootstrap:
      username: admin
      password: "LocalTest12!"
  systemMicroservices:
    router:
      amd64: {{REGISTRY}}/router:3.9.3
      arm64: {{REGISTRY}}/router:3.9.3
      arm: {{REGISTRY}}/router:3.9.3
      riscv64: {{REGISTRY}}/router:3.9.3
    nats:
      amd64: {{REGISTRY}}/nats:2.15.2
      arm64: {{REGISTRY}}/nats:2.15.2
      arm: {{REGISTRY}}/nats:2.15.2
      riscv64: {{REGISTRY}}/nats:2.15.2
  nats:
    enabled: true
  systemAgent:
    config:
      arch: amd64
  events:
    auditEnabled: true
    retentionDays: 14
